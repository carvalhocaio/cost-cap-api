services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: costcap
      POSTGRES_PASSWORD: costcap
      POSTGRES_DB: costcap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costcap -d costcap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
