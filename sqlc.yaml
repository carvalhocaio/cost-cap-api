version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/postgres/sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_enum_valid_method: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: date
            go_type:
              import: time
              type: Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type:
              import: time
              type: Time
